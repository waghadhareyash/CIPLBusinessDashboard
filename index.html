<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CIPL Business Dashboard – web version demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
:root{
  box-sizing:border-box;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f5f7; --surface:#ffffff; --text:#101828; --text2:#667085; --line:#e4e7ec; --rowline:#edf0f3;
  --head:#fdf3ea; --sec:#f1f3f6; --tot:#fff0e2; --hover:#f6f8fb;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#dff1ee; --neg:#c2410c;
  --okb:#dcfce7; --okt:#166534; --wb:#fef3c7; --wt:#92400e; --bb:#fee2e2; --bt:#991b1b;
  --font:Manrope,"Segoe UI",Roboto,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:40}
button,select,input{font-family:inherit}
.app{height:100%;display:grid;grid-template-columns:224px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}

/* top bar */
.topbar{grid-column:1 / -1;grid-row:1;display:flex;align-items:center;gap:14px;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:196px}
.brand b{font-size:15.5px;font-weight:800;letter-spacing:-.01em;display:block;line-height:1.15}
.brand span{color:var(--text2);font-size:12px;display:block;line-height:1.2}
.sp{flex:1}
.ctl{display:flex;flex-direction:column;gap:2px}
.ctl label{font-size:11px;color:var(--text2);font-weight:600}
.topbar select{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;min-width:150px}
.topbar select:focus-visible,.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.cin:focus-visible,.q:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);background:var(--accent)}
.avs{display:flex;align-items:center}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;border:2px solid var(--surface);margin-left:-8px;position:relative}
.av:first-child{margin-left:0}
.av i{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid var(--surface)}

/* sidebar */
.tabbar{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:4px;background:var(--surface);border-right:1px solid var(--line);padding:14px 12px;overflow:auto}
.tab{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--text2);padding:10px 12px;font-size:13.5px;font-weight:700;cursor:pointer;border-radius:10px;text-align:left}
.tab svg{flex:none}
.tab:hover{background:var(--hover);color:var(--text)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.status .pill{border-radius:10px;line-height:1.35;text-align:left}
.status{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--text2);padding:12px 6px 2px;border-top:1px solid var(--line)}

/* stage */
.stage{grid-column:2;grid-row:2;min-height:0;overflow:auto;padding:18px 22px 32px;background:var(--bg)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;position:sticky;left:0}
.q{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;width:250px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--surface)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2)}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid #d99a2b;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;color:var(--text);position:sticky;left:0;max-width:900px}
.foot{font-size:12px;color:var(--text2);margin:12px 0 0;max-width:900px;position:sticky;left:0;line-height:1.5}

/* summary strip */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:clip;position:sticky;left:0;max-width:1240px}
.kpi{padding:14px 18px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi small{color:var(--text2);font-size:12px;font-weight:600;display:block}
.kpi b{font-size:25px;font-weight:800;letter-spacing:-.02em;display:block;margin:3px 0 7px;line-height:1.1}
.kpi span{font-size:12px;color:var(--text2)}

/* the sheet: same table, modern skin */
.sheet{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;overflow:clip;width:max-content;min-width:100%;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.shead{display:grid;grid-template-columns:1fr auto;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:2px 16px}
.shead .co{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.shead .tt{font-size:13px;color:var(--text2);font-weight:600;grid-column:1}
.shead .rt{grid-column:2;grid-row:1 / span 2;display:flex;align-items:center;gap:18px}
.tbox{background:var(--accent-soft);color:var(--text);border-radius:10px;padding:7px 16px;text-align:left;font-size:12px;font-weight:600;line-height:1.3}
.tbox b{display:block;font-size:19px;font-weight:800;color:var(--accent);letter-spacing:-.01em}
table.x{border-collapse:separate;border-spacing:0;table-layout:fixed;width:100%}
.x td,.x th{border:0;border-bottom:1px solid #c9cfd8;border-right:1px solid #c9cfd8;padding:0 10px;height:32px;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.x th{background:var(--head);color:var(--text);font-weight:800;text-align:center;line-height:1.25;white-space:normal;height:auto;padding:9px 6px;font-size:12px;border-bottom:1px solid #b9c0cb}
.x th small{font-weight:600;font-size:11px;color:var(--text2)}
.x thead th{position:sticky;top:0;z-index:2}
.x.dash thead th{position:static}
.x td.gap,.x th.gap{border:0;background:transparent;padding:0}
.x td.gap + td,.x th.gap + th{border-left:1px solid #c9cfd8}
.x tr:first-child th:first-child,.x td:first-child,.x th:first-child{border-left:0}
.x tr.sec td{background:var(--sec);font-weight:800;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.x tr.sec td.l{text-align:center;border-left:3px solid var(--accent)}
.x tr.sec td.t{text-align:left}
.x tr.sec td.mw,.x tr.sec td.gap{background:transparent;border-color:transparent}
.x tr.pe td{background:var(--tot);font-weight:800}
.x tr.pe td.mw{background:transparent}
.x tr.tot td{background:var(--tot);font-weight:800;border-top:1px solid var(--line)}
.x tr.bt td{font-weight:800}
.x tbody tr:not(.sec):not(.tot):not(.pe):not(.empty):hover td:not(.gap):not(.mw){background:var(--hover)}
.x td.n{text-align:center}
.x td.r{text-align:right}
.x td.lb{text-align:left}
.x td.mc{text-align:center;padding:0 2px}
.x td.neg{color:var(--neg);font-weight:700}
.x td.ed{padding:0}
.x td.ed:hover{box-shadow:inset 0 0 0 1.5px var(--accent);cursor:text}
.x td.ed:focus-within{box-shadow:inset 0 0 0 2px var(--accent);background:var(--surface)}
.cin{display:block;width:100%;height:30px;border:0;background:transparent;font:inherit;color:inherit;text-align:inherit;padding:0 10px;outline:none;text-overflow:ellipsis}
td.n .cin,td.mc .cin{text-align:center}
td.mc .cin{padding:0 2px}
select.cin{appearance:none;-webkit-appearance:none;cursor:pointer}
input[type=month].cin{padding:0 4px;color-scheme:light}
.pb{display:inline-block;width:46px;height:6px;border-radius:99px;background:var(--line);vertical-align:middle;margin-right:8px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pb.wide{display:block;width:100%;margin:0 0 7px}
td.pcx{white-space:nowrap}
.pl,td.st-c .cin,td.st-p .cin,td.st-l .cin{display:inline-block;border-radius:999px;font-weight:800;font-size:12px;padding:3px 12px;line-height:1.3}
td.st-c .cin,td.st-p .cin,td.st-l .cin{height:auto;width:auto;margin:0 auto;padding:3px 12px}
td.st-c .pl,td.st-c .cin{background:var(--okb);color:var(--okt)}
td.st-p .pl,td.st-p .cin{background:var(--wb);color:var(--wt)}
td.st-l .pl,td.st-l .cin{background:var(--bb);color:var(--bt)}
.x tr.reg td{height:34px}
.x tr.reg td.nm{text-align:left}
.x tr.empty td{text-align:center;color:var(--text2);height:56px}
.pres{outline:2px solid var(--pc);outline-offset:-2px;position:relative;overflow:visible!important}
.pres::after{content:attr(data-who);position:absolute;right:-2px;top:0;transform:translateY(-100%);background:var(--pc);color:#fff;font-size:10.5px;font-weight:700;line-height:1;padding:3px 7px;border-radius:5px 5px 0 0;white-space:nowrap;z-index:5}
.flag{color:#d97706;cursor:pointer;font-weight:800}
.x.sum{width:280px;margin:14px 0 16px 18px}
.x.sum td{padding:0 12px}
.x.sum .ok{color:var(--accent);font-weight:800}

/* admin panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:980px;margin-bottom:16px}
.panel h2{margin:0 0 4px;font-size:18px;font-weight:800}
.panel p{margin:0 0 12px;color:var(--text2);font-size:13px}
table.ux{border-collapse:collapse;width:100%;font-size:13px}
.ux th,.ux td{padding:10px 10px;border-bottom:1px solid var(--rowline);text-align:left}
.ux th{font-size:12px;color:var(--text2);font-weight:800}
.ux td.c,.ux th.c{text-align:center}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:800;background:var(--accent-soft);color:var(--accent)}
.pill.v{background:var(--sec);color:var(--text2)}
.pill.on{background:var(--accent);color:var(--accent-ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:7px}
.dot.off{background:#9aa19d}

/* drawer + toast */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);background:var(--surface);color:var(--text);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-10px 0 28px rgba(16,24,40,.16)}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer h3{margin:0;font-size:16px;font-weight:800}
.drawer .x-btn{border:0;background:transparent;color:var(--text);font-size:22px;cursor:pointer;line-height:1}
.drawer ol{list-style:none;margin:0;padding:6px 0;overflow:auto;flex:1}
.drawer li{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--rowline);font-size:13px;line-height:1.45}
.drawer li .av{margin:0;flex:none}
.drawer li time{display:block;color:var(--text2);font-size:11.5px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#101828;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:60;max-width:90vw}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
  .tabbar{grid-column:1;grid-row:2;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .tab{white-space:nowrap}
  .status{display:none}
  .stage{grid-column:1;grid-row:3;padding:14px 10px 28px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{border-bottom:1px solid var(--line)}
  .q{width:100%}
}
</style>

</head>

/* ===================== calculations (the Excel formulas) ===================== */
function calc(f){
  var c={};
  c.A=f.dash.A.map(sum);c.C=f.dash.C.map(sum);
  c.colA=[];c.colC=[];
  for(var j=0;j<12;j++){c.colA.push(sum(f.dash.A.map(function(r){return r[j];})));c.colC.push(sum(f.dash.C.map(function(r){return r[j];})));}
  c.totA=sum(c.A);c.totC=sum(c.C);c.tgtA=sum(f.tgt.enq);c.tgtC=sum(f.tgt.ord);
  var cur=f.enquiries.filter(function(e){return e.blk==='cur';});
  function st(s){return cur.filter(function(e){return e.status===s;});}
  function val(a){return sum(a.map(function(e){return e.val;}));}
  c.B={count:cur.filter(function(e){return e.status;}).length,value:val(cur),conf:st('Confirm').length,confV:val(st('Confirm')),prog:st('In Progress').length,progV:val(st('In Progress')),lost:st('Lost').length,lostV:val(st('Lost'))};
  c.spillK=sum(f.spill.map(function(r){return r.bal;}));
  c.spillM=sum(f.spill.map(spillM));
  c.ordJ=sum(f.orders.map(function(o){return o.val;}));
  c.ordM=sum(f.orders.map(ordM));
  c.expected=c.spillM+c.ordM;
  c.bill=f.dash.bill.map(sum);c.coll=f.dash.coll.map(sum);
  c.colBill=[];c.colColl=[];
  for(var k=0;k<12;k++){c.colBill.push(sum(f.dash.bill.map(function(r){return r[k];})));c.colColl.push(sum(f.dash.coll.map(function(r){return r[k];})));}
  return c;
}
function pctOf(r){return r.pct==null?1:r.pct;}
function spillM(r){return (+r.bal||0)*pctOf(r);}
function ordM(o){return o.ovr!=null?o.ovr:(+o.val||0)*pctOf(o);}

  }
  var prev=[],cur=[];
  f.enquiries.forEach(function(e,i){if(ok(e)){(e.blk==='prev'?prev:cur).push(row(e,i));}});
  var h='';
  if(false){
    h+='<tr class="sec"><td></td><td colspan="10" class="t" style="text-align:left;padding-left:8px">'+esc(f.prevLabel)+'</td></tr>'+(prev.join('')||'');

}

  var f=FY[S.fy],c=calc(f),ed=can('register'),B=c.B;
  var counts={All:B.count,Confirm:B.conf,'In Progress':B.prog,Lost:B.lost};
  var h='<div class="bar"><input class="q" id="q" type="search" placeholder="Search project, location, client" value="'+esc(S.q)+'" aria-label="Search enquiries">';
  ['All','Confirm','In Progress','Lost'].forEach(function(s){h+='<button type="button" class="chip" data-act="sf" data-v="'+s+'" aria-pressed="'+(S.sf===s)+'">'+s+' ('+counts[s]+')</button>';});
  h+='<span class="sp"></span>'+(ed?'<button class="btn pri" type="button" data-act="addEnq">Add enquiry</button>':'')+'</div>';
  if(f.note)h+='<div class="note lock">'+esc(f.note)+'</div>';
  h+='<div class="sheet">'+sheetHead('Enquiries Register / Business Funnel \u2013 '+f.asOfLabel+' (as on '+f.asOf+')','<div class="tbox">Total expected value<b>'+rs(B.value)+'</b></div>');
  h+='<table class="x" style="width:1518px"><colgroup>';
  [48,140,320,104,128,108,128,100,104,128,210].forEach(function(w){h+='<col style="width:'+w+'px">';});
  h+='</colgroup><thead><tr><th>Sr.<br>No.</th><th>Enquiry<br>Month</th><th>Project Name<br><small>(Client Name - Project Details)</small></th><th>Project<br>Category</th><th>Scope of<br>Works</th><th>Contract<br>Type</th><th>Location</th><th>Expected<br>Project Value<br><small>(Rs. In Lakhs)</small></th><th>Client Type<br><small>(Individual/<br>Corporate)</small></th><th>Status</th><th>Remarks / Updates<br><small>(Why lost)</small></th></tr></thead><tbody id="regBody">'+regRows()+'</tbody>';
  h+='<tfoot><tr class="tot"><td colspan="2"></td><td class="lb">TOTAL</td><td colspan="4"></td><td class="n">'+fmt(B.value)+'</td><td colspan="3"></td></tr></tfoot></table>';
  h+='<table class="x sum"><colgroup><col style="width:120px"><col style="width:140px"></colgroup>';
  h+='<tr><td class="lb">Confirm</td><td class="r">'+fmt(B.confV)+'</td></tr><tr><td class="lb">Lost</td><td class="r">'+fmt(B.lostV)+'</td></tr><tr><td class="lb">In Progress</td><td class="r">'+fmt(B.progV)+'</td></tr>';
  var tot=B.confV+B.lostV+B.progV,diff=Math.round((tot-B.value)*100)/100;
  h+='<tr class="bt"><td class="lb">Sum of the three</td><td class="r">'+fmt(tot)+'</td></tr><tr><td class="lb">Check (should be 0)</td><td class="r '+(diff===0?'ok':'')+'">'+fmt(diff)+(diff===0?' \u2713':'')+'</td></tr></table></div>';
  h+='<p class="foot">In Excel this check showed 200 because last year\u2019s rows were mixed into one total. Here each year keeps its own total, so the three statuses always add up.</p>';
  return h;
}

/* ===================== Ongoing Projects ===================== */
function prjHTML(){
  var f=FY[S.fy],c=calc(f),ed=can('projects');
  var h='<div class="bar">'+(ed?'<button class="btn pri" type="button" data-act="addOrd">Add order</button>':'')+'</div>';
  if(f.note)h+='<div class="note lock">'+esc(f.note)+'</div>';
  h+='<div class="sheet">'+sheetHead('Confirmed Orderbook & Target Billing','<div class="tbox">Target billing in '+esc(f.label)+'<b>'+rs(c.expected)+'</b></div>');
  h+='<div style="padding:8px 18px;font-size:12px;color:var(--text2);border-bottom:1px solid var(--line)">Note: all values in Rs. lakhs</div>';
  h+='<table class="x" style="width:1648px"><colgroup>';
  [48,140,70,310,104,128,112,120,96,112,96,112,200].forEach(function(w){h+='<col style="width:'+w+'px">';});
  h+='</colgroup><thead><tr><th>Sr.<br>No.</th><th>Order<br>Month</th><th>Project<br>ID</th><th>Project Name<br><small>(Client Name - Project Details)</small></th><th>Project<br>Category</th><th>Scope of<br>Works</th><th>Contract<br>Type</th><th>Location</th><th>Project<br>Value<br><small>(Rs. In Lakhs)</small></th><th>Balance / Spillover Billing<br><small>(from '+esc(f.prevLabel.split(' / ').pop())+')</small></th><th>Target %<br>Completion in<br>'+esc(f.label)+'</th><th>Target Billing in<br>'+esc(f.label)+'<br><small>(for new projects)</small></th><th>Status /<br>Remarks</th></tr></thead><tbody>';
  h+='<tr class="sec"><td class="l">A</td><td colspan="12" style="text-align:left;padding-left:8px">Balance / Spillover Billing ('+esc(f.prevLabel.split(' / ').pop())+')</td></tr>';
  if(!f.spill.length)h+='<tr class="empty"><td colspan="13">No carried-over projects for this year.</td></tr>';
  f.spill.forEach(function(r,i){
    var P='spill.'+i+'.';
    h+='<tr class="reg"><td class="n">'+(i+1)+'</td><td></td>'+tdIn(P+'id',r.id,'s',ed,'n')+tdIn(P+'name',r.name,'s',ed,'nm')+tdSel(P+'cat',r.cat,CATS,ed)+tdSel(P+'scope',r.scope,SCOPES,ed)+tdSel(P+'ct',r.ct,CTS,ed)+tdIn(P+'loc',r.loc,'s',ed)+tdIn(P+'val',r.val,'n',ed,'n')+tdIn(P+'bal',r.bal,'n',ed,'n')+tdPct(P+'pct',pctOf(r),ed)+'<td class="n bt">'+fmt(spillM(r))+'</td>'+tdIn(P+'rem',r.rem,'s',ed)+'</tr>';
  });
  h+='<tr class="tot"><td colspan="3"></td><td class="lb">SUB - TOTAL</td><td colspan="4"></td><td></td><td class="n">'+fmt(c.spillK)+'</td><td></td><td class="n">'+fmt(c.spillM)+'</td><td></td></tr>';
  h+='<tr class="sec"><td class="l">B</td><td colspan="12" style="text-align:left;padding-left:8px">New Projects ('+esc(f.label)+')</td></tr>';
  if(!f.orders.length)h+='<tr class="empty"><td colspan="13">No orders yet. Use \u201CAdd order\u201D to enter the first one.</td></tr>';
  f.orders.forEach(function(o,i){
    var P='orders.'+i+'.',m=ordM(o),calcM=(+o.val||0)*pctOf(o),diff=o.ovr!=null&&Math.abs(o.ovr-calcM)>0.005;
    var mc=diff?'<td class="n bt" title="Excel had '+fmt(o.ovr)+' typed in. Value \u00D7 % gives '+fmt(calcM)+'. Click the flag to use the formula."><span class="flag" data-act="fix" data-i="'+i+'" role="button" tabindex="0" aria-label="Use formula">\u26A0</span> '+fmt(m)+'</td>':'<td class="n bt">'+fmt(m)+'</td>';
    h+='<tr class="reg"><td class="n">'+(i+1)+'</td>'+tdMonth(P+'m',o.m,ed)+tdIn(P+'id',o.id,'s',ed,'n')+tdIn(P+'name',o.name,'s',ed,'nm')+tdSel(P+'cat',o.cat,CATS,ed)+tdSel(P+'scope',o.scope,SCOPES,ed)+tdSel(P+'ct',o.ct,CTS,ed)+tdIn(P+'loc',o.loc,'s',ed)+tdIn(P+'val',o.val,'n',ed,'n')+'<td class="n">NA</td>'+tdPct(P+'pct',pctOf(o),ed)+mc+tdIn(P+'rem',o.rem,'s',ed)+'</tr>';
  });
  h+='<tr class="tot"><td colspan="3"></td><td class="lb">SUB - TOTAL</td><td colspan="4"></td><td class="n">'+fmt(c.ordJ)+'</td><td></td><td></td><td class="n">'+fmt(c.ordM)+'</td><td></td></tr>';
  h+='<tr class="tot"><td colspan="3"></td><td class="lb">GRAND - TOTAL</td><td colspan="4"></td><td class="n">'+fmt(c.ordJ)+'</td><td class="n">'+fmt(c.spillK)+'</td><td></td><td class="n">'+fmt(c.expected)+'</td><td></td></tr>';
  h+='</tbody></table></div>';
  h+='<p class="foot">Target billing = project value (or spillover balance) \u00D7 target % completion. The dashboard reads its booking value and expected billing from this sheet.</p>';
  return h;
}

/* ===================== Users & Access ===================== */
function usrHTML(){
  var rows=Object.keys(ROLES).map(function(k,i){var r=ROLES[k];
    return '<tr><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.title)+'</td><td>'+esc(r.email)+'</td><td><span class="dot'+(i<4?'':' off')+'"></span>'+(i<4?'Online':'Last seen yesterday')+'</td></tr>';}).join('');
  var mx=[['Admin',1,1,1,1,1],['Sales coordinator',0,0,1,0,0],['Project manager',0,0,0,1,0],['Accounts',0,1,0,0,0],['Viewer',0,0,0,0,0]];
  var head=['Targets and monthly counts','Billing and collection','Enquiries Register','Ongoing Projects','Users and access'];
  var m='<table class="ux"><thead><tr><th>Role</th>'+head.map(function(x){return '<th class="c">'+x+'</th>';}).join('')+'</tr></thead><tbody>'+mx.map(function(r){return '<tr><td><b>'+r[0]+'</b></td>'+r.slice(1).map(function(v){return '<td class="c">'+(v?'<span class="pill on">Edit</span>':'<span class="pill v">View</span>')+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
  return '<div class="panel"><h2>People</h2><p>Everyone signs in with their own account, so every change is recorded against a name.</p><table class="ux"><thead><tr><th>Name</th><th>Role</th><th>Email</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table><div style="margin-top:12px"><button class="btn pri" type="button" data-act="invite">Invite user</button></div></div>'
   +'<div class="panel"><h2>What each role can do</h2><p>Everyone can view every sheet. Edit rights are set per sheet.</p>'+m+'</div>'
   +'<div class="panel"><h2>Closed years</h2><p>FY 24-25 and FY 25-26 are closed. Only Admin can change a closed year. Reopening or closing a year is one click here.</p><span class="pill">FY 24-25 closed</span> <span class="pill">FY 25-26 closed</span> <span class="pill on">FY 26-27 open</span></div>';
}

/* ===================== shell rendering ===================== */
var ICON={dash:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',reg:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>',prj:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',usr:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M17 4.5a3.5 3.5 0 0 1 0 7M21.5 20c0-2.6-1.4-4.5-3.5-5.4"/></svg>'};
function initShell(){
  $('#roleSel').innerHTML=Object.keys(ROLES).map(function(k){return '<option value="'+k+'">'+esc(ROLES[k].name+' ('+ROLES[k].title+')')+'</option>';}).join('');
  $('#roleSel').value=S.role;
  fillFY();
  $('#tabbar').innerHTML='';
  TABS.forEach(function(t){
    var b=document.createElement('button');b.type='button';b.className='tab';b.id='tab-'+t.id;b.setAttribute('role','tab');b.dataset.tab=t.id;b.innerHTML=ICON[t.id]+'<span>'+t.label+'</span>';
    $('#tabbar').appendChild(b);
  });
  var st=document.createElement('div');st.className='status';st.id='status';$('#tabbar').appendChild(st);
}
function fillFY(){
  var keys=Object.keys(FY).sort();
  $('#fySel').innerHTML=keys.map(function(k){return '<option value="'+k+'">'+FY[k].label+(FY[k].tag?' ('+FY[k].tag+')':'')+(FY[k].locked?' - closed':'')+'</option>';}).join('')+'<option value="__new">+ New financial year</option>';
  $('#fySel').value=S.fy;
}
function renderChrome(){
  var r=ROLES[S.role];
  $('#avs').innerHTML=Object.keys(ROLES).filter(function(k){return k!==S.role&&k!=='viewer';}).map(function(k){var o=ROLES[k];return '<div class="av" style="background:'+o.color+'" title="'+esc(o.name)+' is online">'+o.init+'<i></i></div>';}).join('')+'<div class="av" style="background:'+r.color+'" title="You">'+r.init+'<i></i></div>';
  TABS.forEach(function(t){
    var b=$('#tab-'+t.id);
    b.hidden=!!(t.admin&&r.can.indexOf('users')<0);
    b.setAttribute('aria-selected',String(S.tab===t.id));
  });
  var areas=tabArea(S.tab),txt='View only',on=false;
  if(S.tab==='usr'){txt='Admin';on=true;}
  else if(areas.length){on=true;txt={dash:'You can edit: '+areas.map(function(a){return {targets:'targets',monthly:'monthly counts',billing:'billing and collection'}[a];}).join(', '),reg:'You can edit this sheet',prj:'You can edit this sheet'}[S.tab];}
  else if(FY[S.fy].locked&&S.role!=='admin')txt='View only (closed year)';
  var last=S.last?'Saved '+S.last:'All changes saved';
  $('#status').innerHTML='<span class="pill'+(on?' on':' v')+'">'+esc(txt)+'</span><span>'+esc(last)+'</span>';
}
function render(){
  pend=false;
  var stage=$('#stage'),top=stage.scrollTop,left=stage.scrollLeft;
  if(S.tab==='usr'&&ROLES[S.role].can.indexOf('users')<0)S.tab='dash';
  PRES=presence();
  var f=FY[S.fy],h='';
  if(S.tab==='dash'){
    var bar='<div class="bar">';
    if(can('monthly'))bar+='<button class="btn" type="button" data-act="sync">Recount enquiries from the register</button>';
    bar+='</div>';
    h=bar+(f.note?'<div class="note lock">'+esc(f.note)+'</div>':'')+(f.dashNote?'<div class="note">'+esc(f.dashNote)+'</div>':'')+kpiHTML(f,calc(f))+'<div class="sheet">'+dashHTML()+'</div>'+(f.flagProg?'<p class="foot">\u2020 Excel showed \u20B9 1,343.25 here. Its formula also counted a \u20B9 200 L enquiry from last year, which is why the three status values added up to 106%. The web version counts this year\u2019s enquiries only.</p>':'')+'<p class="foot">Hover a cell you can edit to see its outline. Totals, percentages and shortfalls recalculate as you type. Darker month cells mean higher counts.</p>';
  }else if(S.tab==='reg')h=regHTML();
  else if(S.tab==='prj')h=prjHTML();
  else h=usrHTML();
  stage.innerHTML=h;
  stage.scrollTop=top;stage.scrollLeft=left;
  renderChrome();
  renderLog();
}
function renderLog(){
  $('#logList').innerHTML=S.log.map(function(e){return '<li><div class="av" style="background:'+e.who.color+'">'+e.who.init+'</div><div><b>'+esc(e.who.name)+'</b> '+esc(e.text)+'<time>'+esc(e.time)+'</time></div></li>';}).join('');
}
function pushLog(text){
  var who=ROLES[S.role],t=nowStamp();
  S.log.unshift({who:who,text:text,time:t});
  S.last=t.split(', ')[1]+' by '+who.name;
}
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true;},2600);}

/* ===================== editing ===================== */
var FIELD={name:'project name',cat:'category',scope:'scope of works',ct:'contract type',loc:'location',val:'value',client:'client type',status:'status',rem:'remarks',m:'month',id:'project ID',bal:'spillover balance',pct:'completion'};
function describe(toks,o,a,b){
  var A=a==null||a===''?'blank':(toks[toks.length-1]==='pct'?Math.round(a*100)+'%':a);
  var Bv=b==null?'blank':(toks[toks.length-1]==='pct'?Math.round(b*100)+'%':b);
  var r=toks[0],k=toks[toks.length-1];
  if(r==='dash'){
    var sn={A:'Enquiries Generation, '+LA[+toks[2]],C:'Confirmed Order Booking, '+LC[+toks[2]],bill:'Actual Billing Done, row '+(+toks[2]+1),coll:'Revenue Collected, row '+(+toks[2]+1)}[toks[1]];
    var j=+toks[3];return 'Changed '+sn+' for '+MN[j]+"'"+yy(j<9?FY[S.fy].y:FY[S.fy].y+1)+' from '+A+' to '+Bv+'.';
  }
  if(r==='tgt')return 'Changed the annual target from '+A+' to '+Bv+'.';
  if(r==='enquiries')return 'Changed enquiry '+o.sr+(o.name?' ('+o.name+')':'')+' '+(FIELD[k]||k)+' from '+A+' to '+Bv+'.';
  return 'Changed '+(o.name||'a project')+' '+(FIELD[k]||k)+' from '+A+' to '+Bv+'.';
}
function applyEdit(path,raw,t){
  var f=FY[S.fy],toks=path.split('.'),o=f,i;
  for(i=0;i<toks.length-1;i++)o=o[toks[i]];
  var k=toks[toks.length-1],v=raw;
  if(t==='n'){v=raw===''?null:parseFloat(raw);if(v!=null&&isNaN(v))v=null;}
  else if(t==='p'){v=raw===''?null:parseFloat(raw);if(v!=null&&isNaN(v))v=null;if(v!=null)v=Math.max(0,Math.min(100,v))/100;}
  var old=o[k];
  if(old===v||(old==null&&v==null)||(old==null&&v==='')||(old===''&&v==null))return;
  o[k]=v;
  if(toks[0]==='orders'&&(k==='val'||k==='pct'))delete o.ovr;
  pushLog(describe(toks,o,old,v));
  schedule();
}

var down=false,pend=false;
function schedule(){pend=true;if(!down)setTimeout(flush,0);}
function flush(){
  if(!pend||down)return;
  var a=document.activeElement,p=a&&a.dataset?a.dataset.p:null;
  render();
  if(p){var n=document.querySelector('[data-p="'+p+'"]');if(n){n.focus();if(n.select&&n.type!=='month')n.select();}}
}
document.addEventListener('pointerdown',function(){down=true;},true);
document.addEventListener('pointerup',function(){down=false;setTimeout(flush,40);},true);

/* ===================== events ===================== */
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.id==='fySel'){
    if(el.value==='__new'){
      var keys=Object.keys(FY).sort(),last=FY[keys[keys.length-1]],nf=newBlankFY(last.y+1,last.tgt);
      FY[nf.key]=nf;S.fy=nf.key;fillFY();S.last=null;
      S.log.unshift({who:ROLES[S.role],text:'Started '+nf.label+' with the same annual targets as '+last.label+'.',time:nowStamp()});
      toast(nf.label+' created with last year\u2019s targets.');
    }else S.fy=el.value;
    S.q='';S.sf='All';render();return;
  }
  if(el.id==='roleSel'){S.role=el.value;render();toast('Now viewing as '+ROLES[S.role].name+'.');return;}
  if(el.id==='showPrev'){S.showPrev=el.checked;$('#regBody').innerHTML=regRows();return;}
  if(el.dataset&&el.dataset.p){applyEdit(el.dataset.p,el.value,el.dataset.t);}
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='q'){S.q=ev.target.value;$('#regBody').innerHTML=regRows();}
});
function act(el){
  var a=el.dataset.act,f=FY[S.fy];
  if(a==='sf'){S.sf=el.dataset.v;render();}
  else if(a==='addEnq'){
    var n=Math.max.apply(null,[0].concat(f.enquiries.filter(function(e){return e.blk==='cur';}).map(function(e){return e.sr;})))+1;
    var pm=f.asOf.split('.'),ym=(2000+ +pm[2])+'-'+pm[1];
    f.enquiries.push({sr:n,m:ym,name:'',cat:'Office',scope:'Interior',ct:'Turnkey',loc:'Pune',val:null,client:'Corporate',status:'In Progress',rem:'',blk:'cur'});
    pushLog('Added enquiry '+n+'.');render();
    var inp=document.querySelector('[data-p="enquiries.'+(f.enquiries.length-1)+'.name"]');
    if(inp){inp.scrollIntoView({block:'center'});inp.focus();}
  }else if(a==='addOrd'){
    var pm2=f.asOf.split('.');
    f.orders.push({m:(2000+ +pm2[2])+'-'+pm2[1],id:'',name:'',cat:'Office',scope:'Interior',ct:'Turnkey',loc:'Pune',val:null,pct:1,rem:''});
    pushLog('Added a new order.');render();
    var inp2=document.querySelector('[data-p="orders.'+(f.orders.length-1)+'.name"]');
    if(inp2){inp2.scrollIntoView({block:'center'});inp2.focus();}
  }else if(a==='fix'){
    var o=f.orders[+el.dataset.i];delete o.ovr;pushLog('Reset target billing for '+o.name+' to value \u00D7 % completion.');render();
  }else if(a==='sync'){
    var nA=deriveA(f),ch=0;
    for(var r=0;r<4;r++)for(var j=0;j<12;j++){if((nA[r][j]||0)!==(f.dash.A[r][j]||0))ch++;}
    f.dash.A=nA;
    pushLog('Recounted Enquiries Generation from the register ('+ch+' cells changed).');render();
    toast(ch?ch+' monthly counts updated to match the register.':'Counts already match the register.');
  }else if(a==='invite'){toast('Invites send an email with a sign-up link.');}
}
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(t){act(t);return;}
  var tb=ev.target.closest('.tab');if(tb){S.tab=tb.dataset.tab;S.q='';S.sf='All';render();$('#stage').scrollTop=0;return;}
});
document.addEventListener('keydown',function(ev){
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.dataset&&ev.target.dataset.act==='fix'){ev.preventDefault();act(ev.target);}
  if(ev.key==='Escape')closeDrawer();
});
function closeDrawer(){$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');}
$('#actBtn').addEventListener('click',function(){var d=$('#drawer');d.classList.add('open');d.setAttribute('aria-hidden','false');});
$('#drClose').addEventListener('click',closeDrawer);
$('#expBtn').addEventListener('click',function(){toast('Export builds an .xlsx in the same layout as your Excel file.');});

initShell();render();
})();
</script>
</body>
</html>
